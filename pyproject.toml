[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g1d-grasp"
version = "0.1.0"
description = "Model-independent data pipeline for G1D three-view grasp demonstrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "h5py>=3.8"]

[project.optional-dependencies]
v3a = ["torch>=2.1", "torchvision>=0.16", "scipy>=1.9", "opencv-python-headless>=4.7"]
test = ["pytest>=7.1", "scipy>=1.9"]

[project.scripts]
g1d-data = "g1d_grasp.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
